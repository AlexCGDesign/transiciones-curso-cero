<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Brote · Plantas de interior</title>
    <meta name="theme-color" content="#F3F2EE">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter+Tight:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./estilos.css">
</head>
<body>

    <div class="app">
 
        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar__content">

                <header class="sidebar__header">

                    <span class="sidebar__logo">B</span>

                    <div class="sidebar__brand">
                        <p class="sidebar__name">Brote</p>
                        <p class="sidebar__badge">Plantas</p>
                    </div>

                </header>

                <nav aria-label="Principal">

                    <ul class="sidebar__list">

                        <li class="sidebar__item">
                            <a href="#" class="sidebar__link">
                                <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z" /></svg>
                                <span class="sidebar__text">Inicio</span>
                            </a>
                        </li>

                        <li class="sidebar__item">
                            <a href="#" class="sidebar__link sidebar__link--active" aria-current="page">
                                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" /><rect x="13" y="3" width="8" height="8" rx="2" /><rect x="3" y="13" width="8" height="8" rx="2" /><rect x="13" y="13" width="8" height="8" rx="2" /></svg>
                                <span class="sidebar__text">Catálogo</span>
                                <span class="sidebar__count">06</span>
                            </a>
                        </li>

                        <li class="sidebar__item">
                            <a href="#" class="sidebar__link">
                                <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" /></svg>
                                <span class="sidebar__text">Favoritos</span>
                                <span class="sidebar__count">03</span>
                            </a>
                        </li>

                        <li class="sidebar__item">
                            <a href="#" class="sidebar__link">
                                <svg viewBox="0 0 24 24"><path d="M3 7h13v10H3zM16 10h4l1 3v4h-5z" /><circle cx="7" cy="19" r="1.5" /><circle cx="18" cy="19" r="1.5" /></svg>
                                <span class="sidebar__text">Pedidos</span>
                                <span class="sidebar__count">02</span>
                            </a>
                        </li>

                        <li class="sidebar__item">
                            <a href="#" class="sidebar__link">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" /></svg>
                                <span class="sidebar__text">Ajustes</span>
                            </a>
                        </li>

                    </ul>

                </nav>

            </div>

        </aside>

        <!-- Página -->
        <main class="page">

            <label class="toggle">
                <input type="checkbox" class="toggle__input">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
                <span class="toggle__text toggle__text--hide">Ocultar</span>
                <span class="toggle__text toggle__text--show">Mostrar</span>
            </label>

        </main>

    </div>

</body>
</html>
